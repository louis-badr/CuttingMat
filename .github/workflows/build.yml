name: Build

# Every push to main builds the app and publishes CuttingMat.dmg as a GitHub release
# (v1.0.<run number>). Pushing a tag such as v2.0.0 publishes it under that name instead.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build the app and the DMG
        run: ./mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CuttingMat-dmg
          path: mac/dist/CuttingMat.dmg
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v1.0.${{ github.run_number }}"; fi
          gh release create "$TAG" mac/dist/CuttingMat.dmg \
            --target "$GITHUB_SHA" \
            --title "Cutting Mat $TAG" \
            --notes "Open the DMG, drag Cutting Mat onto Applications, then open it once. Not notarized: see the README for the first launch." \
            || gh release upload "$TAG" mac/dist/CuttingMat.dmg --clobber
