name: Build

# Every push builds the app (to catch compile errors) and keeps the DMG as an artifact.
# Pushing a tag such as v1.0.0 also publishes CuttingMat.dmg as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app and the DMG
        run: ./mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CuttingMat-dmg
          path: mac/dist/CuttingMat.dmg
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" mac/dist/CuttingMat.dmg \
            --title "Cutting Mat $GITHUB_REF_NAME" \
            --notes "Open the DMG, drag Cutting Mat onto Applications, then open it once. Not notarized: see the README for the first launch." \
            || gh release upload "$GITHUB_REF_NAME" mac/dist/CuttingMat.dmg --clobber
