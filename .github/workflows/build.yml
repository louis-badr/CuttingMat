name: Build

# Every push to main builds the app and replaces the single "latest" release with the new
# CuttingMat.dmg. Older releases are deleted.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build the app and the DMG
        run: ./mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CuttingMat-dmg
          path: mac/dist/CuttingMat.dmg
      - name: Replace the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            gh release delete "$tag" --cleanup-tag --yes
          done
          gh release create latest mac/dist/CuttingMat.dmg \
            --target "$GITHUB_SHA" \
            --title "Cutting Mat" \
            --notes "Open the DMG, drag Cutting Mat onto Applications, then open it once. Not notarized: see the README for the first launch."
